name: Build Application

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ==========================================
  # Сборка для Windows (Setup + Portable)
  # ==========================================
  build-windows:
    name: Build Windows Target
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      # Создание Portable ZIP
      - name: Compress Windows Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Notify-Windows-Portable.zip

      # Создание .exe установщика
      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Create Inno Setup Config
        shell: pwsh
        run: |
          $issContent = @"
          [Setup]
          AppName=Notify
          AppVersion=0.1.0
          DefaultDirName={autopf}\\Notify
          DefaultGroupName=Notify
          UninstallDisplayIcon={app}\\notify.exe
          Compression=lzma2
          SolidCompression=yes
          OutputDir=.
          OutputBaseFilename=Notify-Windows-Setup

          [Files]
          Source: "build\\windows\\x64\\runner\\Release\\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\\Notify"; Filename: "{app}\\notify.exe"
          Name: "{autodesktop}\\Notify"; Filename: "{app}\\notify.exe"

          [Run]
          Filename: "{app}\\notify.exe"; Description: "Launch Notify"; Flags: postinstall nowait skipifsilent
          "@
          Set-Content -Path setup.iss -Value $issContent

      - name: Compile Inno Setup Installer
        run: ISCC.exe setup.iss

      # Сохранение скомпилированных файлов Windows
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            Notify-Windows-Setup.exe
            Notify-Windows-Portable.zip

  # ==========================================
  # Сборка для Linux (AppImage + Portable)
  # ==========================================
  build-linux:
    name: Build Linux Target
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev wget libfuse2 imagemagick

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      # Создание Portable TAR.GZ
      - name: Compress Linux Portable Archive
        run: |
          tar -czvf Notify-Linux-Portable.tar.gz -C build/linux/x64/release/bundle .

      # Сборка AppImage
      - name: Package AppImage
        run: |
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          
          cat <<EOF > AppDir/notify.desktop
          [Desktop Entry]
          Name=Notify
          Exec=notify
          Icon=notify
          Type=Application
          Categories=Utility;
          EOF

          sudo apt-get install -y imagemagick
          convert -size 256x256 xc:#2196F3 -fill white -gravity center -pointsize 72 -draw "text 0,0 'N'" AppDir/usr/share/icons/hicolor/256x256/apps/notify.png
          cp AppDir/usr/share/icons/hicolor/256x256/apps/notify.png AppDir/notify.png

          cat <<EOF > AppDir/AppRun
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/bin/notify" "\$@"
          EOF
          chmod +x AppDir/AppRun

          ./appimagetool-x86_64.AppImage AppDir Notify-Linux.AppImage

      # Сохранение скомпилированных файлов Linux
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            Notify-Linux.AppImage
            Notify-Linux-Portable.tar.gz