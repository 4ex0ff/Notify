name: Build Application

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ==========================================
  # Сборка для Windows (Setup + Portable)
  # ==========================================
  build-windows:
    name: Build Windows Target
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      # Создание Portable ZIP
      - name: Compress Windows Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath YourAppName-Windows-Portable.zip

      # Создание .exe установщика
      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Create Inno Setup Config
        shell: pwsh
        run: |
          $issContent = @"
          [Setup]
          AppName=YourAppName
          AppVersion=1.0.0
          DefaultDirName={autopf}\\YourAppName
          DefaultGroupName=YourAppName
          UninstallDisplayIcon={app}\\your_app.exe
          Compression=lzma2
          SolidCompression=yes
          OutputDir=.
          OutputBaseFilename=YourAppName-Windows-Setup

          [Files]
          Source: "build\\windows\\x64\\runner\\Release\\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\\YourAppName"; Filename: "{app}\\your_app.exe"
          Name: "{autodesktop}\\YourAppName"; Filename: "{app}\\your_app.exe"

          [Run]
          Filename: "{app}\\your_app.exe"; Description: "Launch App"; Flags: postinstall nowait skipifsilent
          "@
          Set-Content -Path setup.iss -Value $issContent

      - name: Compile Inno Setup Installer
        run: ISCC.exe setup.iss

      # Сохранение скомпилированных файлов Windows
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            YourAppName-Windows-Setup.exe
            YourAppName-Windows-Portable.zip

  # ==========================================
  # Сборка для Linux (AppImage + Portable)
  # ==========================================
  build-linux:
    name: Build Linux Target
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev wget

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      # Создание Portable TAR.GZ
      - name: Compress Linux Portable Archive
        run: |
          tar -czvf YourAppName-Linux-Portable.tar.gz -C build/linux/x64/release/bundle .

      # Сборка AppImage
      - name: Package AppImage
        run: |
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          
          cat <<EOF > AppDir/your_app.desktop
          [Desktop Entry]
          Name=YourAppName
          Exec=your_app
          Icon=your_app
          Type=Application
          Categories=Utility;
          EOF

          wget https://raw.githubusercontent.com/flutter/starter/main/public/favicon.png -O AppDir/usr/share/icons/hicolor/256x256/apps/your_app.png
          cp AppDir/usr/share/icons/hicolor/256x256/apps/your_app.png AppDir/your_app.png

          cat <<EOF > AppDir/AppRun
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/bin/your_app" "\$@"
          EOF
          chmod +x AppDir/AppRun

          ./appimagetool-x86_64.AppImage AppDir YourAppName-Linux.AppImage

      # Сохранение скомпилированных файлов Linux
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            YourAppName-Linux.AppImage
            YourAppName-Linux-Portable.tar.gz

  # ==========================================
  # Сборка для Android
  # ==========================================
  # build-android:
  #   name: Build Android Target
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-java@v3
  #       with:
  #         distribution: 'zulu'
  #         java-version: '17'
  #     - uses: subosito/flutter-action@v2
  #       with:
  #         channel: 'stable'
  #         cache: true
  #     - run: flutter pub get
  #     - run: flutter build apk --release
  #     - name: Upload Android Artifacts
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: android-binaries
  #         path: build/app/outputs/flutter-apk/app-release.apk

  # ==========================================
  # Финальный релиз
  # ==========================================
  create-release:
    name: Create Final GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}